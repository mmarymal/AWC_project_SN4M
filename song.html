<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN4M - Dettagli Brano</title>

    <link rel="icon" type="image/png" href="img/logo1.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/playlistAndCommunity.css">
    <link rel="stylesheet" href="css/song.css">

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <div id="global-header"></div>

    <main>
        <section class="community-section container mt-5">
            <h2 class="section-title mb-4">Dettagli Brano</h2>

            <div class="song-card">
                <div class="row">

                    <!-- IMMAGINE ALBUM -->
                    <div class="col-md-4 text-center">
                        <img id="trackImage" src="img/default.jpg" class="img-fluid rounded shadow song-cover">
                    </div>

                    <!-- INFO BRANO -->
                    <div class="col-md-8">
                        <h3 id="trackTitle" class="song-title"></h3>

                        <p><strong>Artista:</strong> <span id="trackArtist"></span></p>
                        <p><strong>Album:</strong> <span id="trackAlbum"></span></p>
                        <p><strong>Durata:</strong> <span id="trackDuration"></span></p>
                        <p><strong>Anno:</strong> <span id="trackYear"></span></p>
                        <p><strong>Genere:</strong> <span id="trackGenre"></span></p>

                        <button class="btn btn-success mt-4" id="addToPlaylistFromSong">
                            ➕ Aggiungi a playlist
                        </button>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 SN4M - Social Network for Music</p>
    </footer>

    <!-- MODALE 1: Aggiungi a Playlist -->
    <div class="modal fade" id="playlistModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
    
                <div class="modal-header">
                    <h5 class="modal-title">Aggiungi a Playlist</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
    
                <div class="modal-body">
                    <p id="modalTrackName"></p>
    
                    <select id="playlistSelect" class="form-select mb-3"></select>
    
                    <button id="btnCreaPlaylist" class="btn btn-outline-primary mt-2" data-bs-toggle="modal"
                        data-bs-target="#createPlaylistModal">
                        Crea nuova playlist
                    </button>
                </div>
    
                <div class="modal-footer">
                    <button class="btn btn-primary" id="addToPlaylistBtn">Aggiungi</button>
                </div>
    
            </div>
        </div>
    </div>
    
    <!-- MODALE 2: Crea Playlist -->
    <div class="modal fade" id="createPlaylistModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form id="newPlaylistForm" class="modal-content">
    
                <div class="modal-header">
                    <h5 class="modal-title">Nuova Playlist</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
    
                <div class="modal-body">
                    <input type="text" id="createPlaylistName" class="form-control mb-2" placeholder="Nome playlist"
                        required>
    
                    <textarea id="playlistDescription" class="form-control mb-2" placeholder="Descrizione playlist" rows="2"
                        required></textarea>
    
                    <input type="text" id="playlistTags" class="form-control mb-2" placeholder="Tag (separati da virgola)"
                        required>
                </div>
    
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Crea</button>
                </div>
    
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/load-header.js" ></script>
    <script type="module" src="js/song.js" ></script>

</body>

</html>
