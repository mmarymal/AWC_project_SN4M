<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN4M - Community</title>
    <link rel="icon" type="image/png" href="logo1.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="community.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div id="global-header"></div>

    <main>
        <section class="community-section container mt-5">
            <div class="row">

                <!-- COLONNA SINISTRA -->
                <div class="col-md-6">
                    <div class="community-header-row">
                        <h2 class="section-title">Le mie community</h2>
                        <button class="btn btn-create-community" data-bs-toggle="modal"
                            data-bs-target="#createCommunityModal">Crea nuova community</button>
                    </div>
                    <div id="myCommunities"></div>
                </div>

                <!-- COLONNA DESTRA -->
                <div class="col-md-6 community-right">
                    <div class="community-header-row">
                        <h2 class="section-title">Altre community disponibili</h2>
                        <input type="text" id="communitySearch" class="community-search" placeholder="Cerca community...">
                    </div>
                    <div id="communityList"></div>
                </div>

            </div>
        </section>
    </main>

    <template id="communityCardTemplate">
        <div class="community-card">
            <div class="community-header">
                <h5 class="community-title"></h5>
                <div class="dropdown">
                    <button class="btn btn-sm btn-transparent" data-bs-toggle="dropdown" aria-expanded="false"
                        title="Opzioni community">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end"></ul>
                </div>
            </div>
        </div>
    </template>

    <footer>
        <p>&copy; 2025 SN4M - Social Network for Music</p>
    </footer>

    <div class="modal fade" id="createCommunityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form id="newCommunityForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crea nuova community</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="communityName" class="form-control mb-2" placeholder="Titolo comunità"
                        required>
                    <textarea id="communityDescription" class="form-control mb-2" placeholder="Descrizione" rows="2"
                        required></textarea>
                    <input type="text" id="communityTags" class="form-control mb-2"
                        placeholder="Tag (separati da virgola)">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Crea</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="editCommunityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form id="editCommunityForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modifica Community</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="editCommunityName" class="form-control mb-2" placeholder="Nome comunità"
                        required>
                    <textarea id="editCommunityDescription" class="form-control mb-2" placeholder="Descrizione"
                        rows="2"></textarea>
                    <input type="text" id="editCommunityTags" class="form-control mb-2"
                        placeholder="Tag (separati da virgola)">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Salva modifiche</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="viewCommunityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content community-details-modal">
                <div class="modal-header">
                    <h5 class="modal-title">Dettagli Community</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewCommunityBody"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmDeleteCommunityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h5 class="modal-title">Conferma eliminazione</h5>
                </div>
                <div class="modal-body">Vuoi davvero eliminare questa community?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteCommunityBtn">Elimina</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICHE -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="sn4mToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Operazione completata!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="community.js"></script>
    <script src="playlist.js"></script>
    <script src="api.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script type="module" src="load-header.js"></script>

</body>

</html>
